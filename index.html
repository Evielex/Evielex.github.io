<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Especial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 120px;
        }

        /* Sobre */
        .envelope {
            position: relative;
            width: 320px;
            height: 210px;
            background: #e91e63;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
        }

        /* Solapa superior del sobre */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 115px solid #d81b60;
            transform-origin: top;
            /* Al cerrar, espera a que baje la carta (0.4s) antes de cerrarse */
            transition: transform 0.5s ease-in-out 0.4s, z-index 0.1s 0.4s;
            z-index: 5;
        }

        /* Bolsillos laterales e inferior */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #c2185b;
            border-right: 160px solid #c2185b;
            border-top: 105px solid transparent;
            border-bottom: 105px solid #ad1457;
            border-radius: 0 0 12px 12px;
            z-index: 4;
        }

        /* Sello de corazón en el sobre */
        .envelope-seal {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 44px;
            background: #ff4081;
            clip-path: polygon(50% 15%, 100% 0, 100% 70%, 50% 100%, 0 70%, 0 0);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 6;
            transition: opacity 0.3s ease 0.5s;
        }

        .envelope-seal span {
            color: white;
            font-size: 19px;
            margin-top: 4px;
        }

        /* Hoja de la carta (oculta cuando el sobre está cerrado) */
        .letter {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            width: 285px;
            height: 185px;
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            opacity: 0;
            visibility: hidden;
            z-index: 2;
            /* Al cerrar, baja y desaparece primero */
            transition: transform 0.5s ease-in, opacity 0.25s ease 0.25s, visibility 0s 0.5s, z-index 0s 0.25s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .letter h2 {
            color: #d81b60;
            font-size: 21px;
            margin-bottom: 6px;
        }

        .letter p {
            color: #444;
            font-size: 14px;
            line-height: 1.45;
        }

        .letter .signature {
            color: #e91e63;
            font-weight: bold;
            font-size: 13px;
            text-align: right;
        }

        /* --- ANIMACIONES AL ABRIR --- */
        .container.open .envelope-seal {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .container.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
            transition: transform 0.5s ease-in-out, z-index 0.1s 0.25s;
        }

        .container.open .letter {
            opacity: 1;
            visibility: visible;
            z-index: 10;
            transform: translateX(-50%) translateY(-145px);
            /* Espera 0.35s a que abra la solapa para subir y hacerse visible */
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.35s,
                        opacity 0.2s ease 0.35s,
                        visibility 0s 0.35s,
                        z-index 0s 0.45s;
        }

        /* Contenedor de los dos botones */
        .controls {
            margin-top: 35px;
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        .action-btn {
            padding: 11px 24px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: background 0.3s, transform 0.2s, opacity 0.3s;
        }

        .btn-open {
            background-color: #e91e63;
            color: white;
        }

        .btn-open:hover:not(:disabled) {
            background-color: #c2185b;
            transform: scale(1.05);
        }

        .btn-close {
            background-color: #ffffff;
            color: #d81b60;
            border: 2px solid #d81b60;
        }

        .btn-close:hover:not(:disabled) {
            background-color: #fce4ec;
            transform: scale(1.05);
        }

        .action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* Corazones flotantes */
        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 3s linear forwards;
            pointer-events: none;
            z-index: 25;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-430px) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="cardContainer">
        <!-- Sobre -->
        <div class="envelope">
            <!-- Hoja de la carta -->
            <div class="letter">
                <h2>¡Para mi bebita preciosa!</h2>
                <p>Cada instante que respiro me recuerda que por ti estoy vivo. Nada me haria mas feliz que seguir contigo toda mi vida.</p>
                <div class="signature">Con todo el amor del mundo ❤️</div>
            </div>

            <div class="envelope-flap"></div>
            <div class="envelope-pocket"></div>
            <div class="envelope-seal">
                <span>❤</span>
            </div>
        </div>

        <!-- Dos botones separados -->
        <div class="controls">
            <button class="action-btn btn-open" id="openBtn">Abrir Carta</button>
            <button class="action-btn btn-close" id="closeBtn" disabled>Cerrar Carta</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('cardContainer');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        let heartInterval = null;

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            
            const rect = container.getBoundingClientRect();
            const randomX = (Math.random() - 0.5) * 240;
            
            heart.style.left = `${rect.width / 2 + randomX}px`;
            heart.style.bottom = `${rect.height / 2}px`;
            
            const size = Math.random() * 18 + 14;
            heart.style.fontSize = `${size}px`;
            
            const duration = Math.random() * 1.5 + 2;
            heart.style.animationDuration = `${duration}s`;

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        function openEnvelope() {
            container.classList.add('open');
            openBtn.disabled = true;
            closeBtn.disabled = false;

            setTimeout(() => {
                for (let i = 0; i < 12; i++) {
                    setTimeout(createHeart, i * 100);
                }
                heartInterval = setInterval(createHeart, 350);
            }, 400);
        }

        function closeEnvelope() {
            container.classList.remove('open');
            openBtn.disabled = false;
            closeBtn.disabled = true;

            clearInterval(heartInterval);
            heartInterval = null;
        }

        openBtn.addEventListener('click', openEnvelope);
        closeBtn.addEventListener('click', closeEnvelope);
    </script>
</body>
</html>
